{% extends "base.html" %}
{% load i18n %}

{% block head_title %}{% trans "Sign Out" %}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h1 class="text-3xl font-extrabold text-blue-600 mb-6 text-center">{% trans "Sign Out" %}</h1>

    <p class="text-gray-500 mb-8 text-center">
        {% trans "Are you sure you want to sign out?" %}
    </p>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
        {% endif %}
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-md">
            {% trans "Sign Out" %}
        </button>
    </form>
</div>
{% endblock %}
