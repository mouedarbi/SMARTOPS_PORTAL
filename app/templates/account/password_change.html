{% extends "base.html" %}
{% load i18n %}
{% load account %}

{% block title %}{% trans "Change Password" %} - SMARTOPS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-md shadow-card border border-line">
    <h1 class="text-3xl font-bold text-navy mb-6 text-center">{% trans "Change Password" %}</h1>

    <form method="POST" action="{% url 'account_change_password' %}" class="password_change space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-full hover:bg-navy transition mt-4" type="submit" name="action">
            {% trans "Change Password" %}
        </button>
        <a href="{% url 'account_reset_password' %}" class="block text-center text-sm text-blue-600 hover:underline">{% trans "Forgot Password?" %}</a>
    </form>
</div>

<style>
    form.password_change p { margin-bottom: 1rem; }
    form.password_change label { display: block; font-weight: 600; font-size: 0.875rem; color: #374151; margin-bottom: 0.25rem; }
    form.password_change input[type="password"] {
        width: 100%; padding: 0.75rem; border: 1px solid #cbdcec; border-radius: 0.375rem; outline: none; transition: border-color 0.2s;
    }
    form.password_change input:focus { border-color: #2563EB; }
    form.password_change ul.errorlist { color: #DC2626; font-size: 0.875rem; margin-bottom: 1rem; list-style: none; padding-left: 0; }
</style>
{% endblock %}
