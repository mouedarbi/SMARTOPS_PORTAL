{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Sign Up Closed" %} - SMARTOPS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl shadow-lg border border-gray-100 text-center">
    <h1 class="text-3xl font-extrabold text-blue-600 mb-6">{% trans "Sign Up Closed" %}</h1>
    <div class="mb-8">
        <svg class="w-16 h-16 text-red-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
    </div>
    <p class="text-gray-600 mb-8 [&_a]:font-semibold [&_a]:text-blue-600 [&_a]:underline">
        {% trans "We are sorry, but the sign up is currently closed." %}
    </p>
    <a href="{% url 'account_login' %}" class="inline-block bg-blue-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-blue-700 transition shadow-md">
        {% trans "Back to Login" %}
    </a>
</div>
{% endblock %}
