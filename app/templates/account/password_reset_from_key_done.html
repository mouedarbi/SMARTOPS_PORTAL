{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password" %} - SMARTOPS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-md shadow-card border border-line text-center">
    <h1 class="text-3xl font-bold text-navy mb-6">{% trans "Change Password" %}</h1>
    <div class="mb-8">
        <svg class="w-16 h-16 text-green-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </div>
    <p class="text-gray-600 mb-8 [&_a]:font-semibold [&_a]:text-blue-600 [&_a]:underline">
        {% trans 'Your password is now changed.' %}
    </p>
    <a href="{% url 'account_login' %}" class="inline-block bg-blue-600 text-white font-bold py-3 px-8 rounded-full hover:bg-navy transition">
        {% trans "Sign In" %}
    </a>
</div>
{% endblock %}
