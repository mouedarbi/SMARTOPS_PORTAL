{% extends "backoffice/base_backoffice.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-10">
        <a href="{% url 'backoffice:user_list' %}" class="text-blue-600 font-bold flex items-center gap-2 mb-4 hover:underline no-underline">
            <i class="las la-arrow-left"></i> Retour
        </a>
        <h2 class="text-3xl font-black text-slate-900">{{ title }}</h2>
    </div>

    <form method="post" class="bg-white p-10 rounded-3xl border border-slate-200 shadow-sm">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="alert alert-danger mb-6">
                {{ form.errors }}
            </div>
        {% endif %}

        <div class="grid grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Langue préférée</label>
                {{ form.preferred_language }}
            </div>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-bold text-slate-700 mb-2">Adresse E-mail</label>
            {{ form.email }}
        </div>

        <div class="space-y-4 mb-10">
            <div class="form-check form-switch bg-slate-50 p-3 rounded-xl border border-slate-100 d-flex align-items-center justify-content-between">
                <label class="form-check-label font-bold text-slate-600 mb-0">Statut Client Actif</label>
                {{ form.is_client }}
            </div>
            <div class="form-check form-switch bg-slate-50 p-3 rounded-xl border border-slate-100 d-flex align-items-center justify-content-between">
                <label class="form-check-label font-bold text-slate-600 mb-0">Accès au Backoffice (Staff)</label>
                {{ form.is_staff }}
            </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">
            Enregistrer les modifications
        </button>
    </form>
</div>

<style>
    label { display: block; }
</style>
{% endblock %}
