{% load static %}
<!-- Socle graphique commun : police Urbanist servie par le Portal (licence SIL OFL) et couleurs de la charte -->
<style>
    @font-face {
        font-family: "Urbanist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("{% static 'vendor/urbanist/urbanist-latin-wght.woff2' %}") format("woff2");
    }
    /* Surtitre de section : majuscules soulignées d'un trait bleu */
    .section-eyebrow { position: relative; display: inline-block; padding-bottom: 6px; font-size: .875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0e1323; }
    .section-eyebrow::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #2563eb; }
    .section-eyebrow.on-dark { color: #fff; }
    /* Titre de colonne du footer : trait bleu court */
    .footer-title { position: relative; padding-bottom: 12px; font-size: 1.25rem; font-weight: 700; }
    .footer-title::after { content: ""; position: absolute; left: 0; bottom: 0; width: 40px; height: 2px; background: #2563eb; }
</style>
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Urbanist', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                },
                colors: {
                    navy: { DEFAULT: '#0e1323', light: '#18203a' },
                    mist: '#edf1fb',
                    line: '#cbdcec',
                },
                boxShadow: {
                    soft: '0 5px 15px rgb(15 36 84 / 5%)',
                    card: '0 20px 60px rgb(15 36 84 / 8%)',
                },
            },
        },
    };
</script>
