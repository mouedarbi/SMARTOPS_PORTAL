{% extends "base.html" %}

{% block title %}Carte Interactive - SMARTOPS{% endblock %}

{% block extra_css %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
    #map { height: 600px; width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .legend { background: white; padding: 10px; line-height: 1.5; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; border-radius: 50%; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col">
            <h1 class="h3 mb-0 text-gray-800">Carte Interactive de Maintenance</h1>
            <p class="text-muted">Visualisation géographique des sites et des tickets d'intervention.</p>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-body">
            <div id="map"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    // Initialisation de la carte (Centrée sur la Belgique par défaut)
    var map = L.map('map').setView([50.8503, 4.3517], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Définition des icônes
    var buildingIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/1008/1008728.png', // Icone building
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
    });

    // Fonction pour créer une icône de ticket selon le statut
    function getTicketIcon(status) {
        let color = "gray"; // Par défaut
        if (status === "planifie") color = "blue";
        if (status === "en_cours") color = "orange";
        if (status === "termine") color = "green";

        // Utilisation d'un marqueur coloré standard pour l'exemple
        return new L.Icon({
            iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
    }

    // Exemple de données (Dans la version finale, elles viendraient du backend)
    var data = {
        sites: [
            { id: 1, name: "Site Principal - Mons", lat: 50.4542, lon: 3.9567 },
            { id: 2, name: "Entrepôt - Charleroi", lat: 50.4108, lon: 4.4446 }
        ],
        tickets: [
            { id: 101, site_id: 1, title: "Réparation Clim", status: "planifie", lat: 50.4542, lon: 3.9570 },
            { id: 102, site_id: 1, title: "Entretien Électrique", status: "en_cours", lat: 50.4545, lon: 3.9565 },
            { id: 103, site_id: 2, title: "Contrôle Sécurité", status: "termine", lat: 50.4108, lon: 4.4446 }
        ]
    };

    // Ajout des sites sur la carte
    data.sites.forEach(site => {
        L.marker([site.lat, site.lon], {icon: buildingIcon})
            .addTo(map)
            .bindPopup(`<b>${site.name}</b><br>ID Site: ${site.id}`);
    });

    // Ajout des tickets sur la carte
    data.tickets.forEach(ticket => {
        L.marker([ticket.lat, ticket.lon], {icon: getTicketIcon(ticket.status)})
            .addTo(map)
            .bindPopup(`<b>Ticket: ${ticket.title}</b><br>Statut: ${ticket.status}`);
    });

</script>
{% endblock %}
